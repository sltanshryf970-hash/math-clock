
name: Build Mathematical Clock APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o math-clock-android-widget-project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-widget assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-clock-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
